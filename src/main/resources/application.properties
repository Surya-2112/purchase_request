spring.application.name=purchase

# MySQL connection (NO database name here)
spring.datasource.url=jdbc:mysql://localhost:3306/purchase_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tell Hibernate which DB to use (this is the DB that will be auto-created)
spring.jpa.properties.hibernate.default_schema=purchase_db

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Remove this line (Spring auto-detects it)
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8081